- title: Access to biodiversity data through web services
  contact: Matthias Obst (matthias.obst@marine.gu.se)
  creator: Gothenburg Global Biodiversity Center (GGBC)
  time_effort: 4-6 hours
  level: PhD level (motivated Master’s students welcome)
  background: Basic R knowledge required
  link: https://github.com/biodiversitydata-se/workshops/tree/master/access_biodiversity_data
  descripton: >
    This online course will focus on automated ways of retrieving and processing biodiversity data from public databases. You will mostly work in the R programming environment and be introduced to common R-packages and functions to retrieve publication-quality (DOI-assigned) species occurrence data from the Global Biodiversity Information Facility (GBIF). Further you will exercise the most important steps of data cleaning and filtering, including taxonomic filtering to account for the variation of species name synonyms and misspellings using the package taxise. The tutorial will also include common approaches to download occurrences of a larger taxonomic group, such as a family or order. Finally you will try some fancy plotting options to best display the retrieved biodiversity data, including plotting on interactive maps. We encourage you to bring your own scientific questions, and if possible run this course together in a small group – this will make the exercises more interesting and comprehensible.

- title: Basic spatial analysis in R
  contact: Matthias Obst (matthias.obst@marine.gu.se)
  creator: Gothenburg Global Biodiversity Center (GGBC)
  time_effort: 4-6 hours
  level: PhD level (motivated Master’s students welcome)
  background: Basic R knowledge required
  link: https://github.com/biodiversitydata-se/workshops/tree/master/spatial_r_workshop
  descripton: >
    This online course will introduce you to several applications related to the reading, processing and plotting of spatial data within the R environment (incl. maps, species ranges, etc.). It’s preferable if you have basic knowledge of the R programming language. You will play with several R-packages related to processing spatial data and work with both vector and raster data, learning how to convert between the two. Further you will run exercises related to plotting species diversity and individual species range maps. This course is intended to familiarize you with the most common spatial data operations and transformation in biodiversity research and provide a toolkit for further exploring big data in ecology and evolutionary research. We encourage you to bring your own data and problems, and if possible run this course together in a small group – this will make the exercises more interesting and comprehensible.   

- title: Advanced spatial analysis in R
  contact: Matthias Obst (matthias.obst@marine.gu.se)
  creator: Gothenburg Global Biodiversity Center (GGBC)
  time_effort: 4-6 hours
  level: PhD level (motivated Master’s students welcome)
  background: Basic R knowledge required 
  link: https://github.com/biodiversitydata-se/workshops/tree/master/advanced_spatial_r
  descripton: >
    This online course helps you to tackle common challenges that arise with any kind of spatial coordinate data in biology. Knowledge of the tools introduced in this workshop is essential when presenting spatial biological data (e.g. a map of sampling sites) in presentations or publications. More specifically you will be introduced to strategies to deal with the non-independence of spatial data points also known as spatial autocorrelation. Further the course addresses challenges arising in global analyses from the simple fact that the earth is round. You will also touch upon some of the globally available environmental predictors often applied in spatial analyses and their potential challenges. To run this course you should have basic knowledge of the R programming language and more specifically with spatial operations in R. We therefore encourage you to run the basic spatial R course (SBDI-03) first. We also encourage you to bring your own data and questions, and if possible run this course together in a small group – this will make the exercises more fun and comprehensible.

- title: Basic Python for Biologists
  contact: Matthias Obst (matthias.obst@marine.gu.se)
  creator: Gothenburg Global Biodiversity Center (GGBC)
  time_effort: 4-6 hours
  level: PhD level (motivated Master’s students welcome)
  background: No Python knowledge required, but previous exposure to other programming languages desired
  link: https://github.com/biodiversitydata-se/workshops/tree/master/python_workshop
  descripton: >
    This module is intended as a Python introduction course, not assuming any prior knowledge of the programming language. It is however useful and desired for participants to have had prior exposure to a different programming language (such as R, bash, Perl, etc.). During this half-day module, you will cover the basic python syntax, starting with the basic objects such as strings, lists, dictionaries and arrays. You will learn how to import packages into python, enabling a variety of third-party functions, with a focus on common applications in biology (packages related to sequence data, and reading of data frames). There is potential for a follow up this tutorial with other tutorials (e.g. Advanced Python for biologists).

- title: Advanced Python for Biologists
  contact: Matthias Obst (matthias.obst@marine.gu.se)
  creator: Gothenburg Global Biodiversity Center (GGBC)
  time_effort: 6-8 hours
  level: PhD level (motivated Master’s students also possible)
  background: Basic Python knowledge required
  link: https://github.com/biodiversitydata-se/workshops/tree/master/advanced_python
  descripton: >
    This is the sequel to the module “Basic Python for biologists”. In this course you will expand your basic Python skills and learn how to write our own Python program with a basic command line user-interaction. During this course you will also run through a mini machine learning exercise. By the end of the course you will have the necessary knowledge to produce personalized tools for common applications in biodiversity research (e.g. processing of ecological data, DNA sequence data, etc). Even though the focus will be on biodiversity data, the course is equally suitable for you if your background is in any of the life-sciences, since the tools and the syntax introduced in this course are universally applicable to any kind of data. We encourage you to bring your own data and problems, which will make the exercises more…spicy.

- title: Basic phylogeography
  contact: Matthias Obst (matthias.obst@marine.gu.se)
  creator: Gothenburg Global Biodiversity Center (GGBC)
  time_effort: 4-6 hours
  level: Basic education biology
  background: no specific background needed
  link: https://github.com/biodiversitydata-se/workshops/tree/master/basic_phylogeography
  descripton: >
    This course will give you a basic introduction to the R environment and show you how to run some very basic analysis of biodiversity data. You will combine biogeographic information with basic sequence analysis. The tutorials in this course explain how to get familiar with R studio, plot maps and build phylogenetic trees and then combine this information. This module is intended for beginners and 1st – 2nd year biology students. Before the exercises you should read the three papers in the “literature” folder. They will explain the scientific questions that can be addressed with an example. We encourage you to run this course in a small group – this will make the exercises more fun and also more comprehensible. After you complete the exercises you should discuss your findings with your peers and reflect on the provided papers in a group discussion.

- title: Advanced phylogenetic analysis with SuperSmartR
  contact: Matthias Obst (matthias.obst@marine.gu.se)
  creator: Gothenburg Global Biodiversity Center (GGBC)
  time_effort: 14-16 hours
  level: PhD level 
  background: Basic knowledge of R and Phylogenetics
  link: https://github.com/biodiversitydata-se/workshops/tree/master/supersmartR-workshop
  descripton: >
    This course will introduce you to a series of R packages that together form a complete phylogenetic analysis pipeline. The tutorials outline all necessary steps for a phylogenetic inference and also demonstrates the steps for advancing and scaling up the method. In this course you will be introduced to the four existing supersmartR packages: phylotaR, restez, outsider, gaius. You will furthermore run simple exercises to create phylogenetic pipelines, develop your own customised analysis pipeline, improve your R programming skills, and become aware of the different phylogenetic and computing options. We encourage you to bring your own data and questions, and if possible run this course together in a small group – this will make the exercises more fun and comprehensible.

- title: Biodiversity data mobilization course
  contact: <a href="mailto:gbif@nrm.se">GBIF-Sweden</a> or <a href="mailto:training@gbif.org">GBIF Secretariat</a>
  creator: This course was first developed as part of the <a href="https://www.gbif.org/programme/82243/bid-biodiversity-information-for-development">Biodiversity Information for Development</a> (BID) programme funded by the European Union.
  link: https://docs.gbif-uat.org/course-data-mobilization/en/
  descripton: >
    This course enables participants to plan and implement biodiversity data mobilization efforts effectively using accepted community standards. Its aim is to increase the volume, richness and quality of the data published through the GBIF network. This course is comprised of video instruction paired with quizzes and practical exercises.
    <br><br>
    Topics include:
    <ul>
      <li>Project management</li>
      <li>Data capture</li>
      <li>Data management</li>
      <li>Data publishing</li>
    </ul>
